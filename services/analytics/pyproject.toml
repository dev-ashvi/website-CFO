[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wyz-analytics"
version = "0.1.0"
description = "Deterministic WYZ Revenue & Margin Intelligence engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.9.0",
  "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
